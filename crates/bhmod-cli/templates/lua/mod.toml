schema = 1
id = "{{id}}"
version = "0.1.0"
name = { en = "{{id}}" }
description = { en = "My first Blockheads mod." }
authors = ["your-name"]
# Your mod, your licence: pick any (MIT, GPL-3.0-or-later, Apache-2.0, ...). Add a LICENSE file before publishing.
license = "MIT"
api = "^0.2"

[sides]
server = true
client = false

[entry]
server = { runtime = "lua", path = "server/main.luau" }

[permissions]
players = ["chat"]

# Talk to client mods over the network (API 0.3.1): raise `api` to "^0.3.1", add `channels = true` above, and let
# clients call a service of yours (add `wit/{{id}}.wit` describing it; `remote-methods` is optional, empty = all):
# [provides]
# services = [{ name = "{{id}}", version = "1.0.0", wit = "wit/{{id}}.wit", remote = true, remote-methods = ["hello"] }]
