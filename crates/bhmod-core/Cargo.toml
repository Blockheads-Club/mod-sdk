[package]
name = "bhmod-core"
description = "Shared Blockheads mod host core: loading, permissions, events, commands, scheduler, storage, budgets, runtimes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
authors.workspace = true
publish = false

[features]
default = ["luau"]
# The Luau runtime (mlua, vendored Luau, sandbox mode).
luau = ["dep:mlua"]
# The JVM runtime (JNI, `libjvm` loaded at run time from the user's JRE; build.rs compiles the Java SDK, so building
# with this feature needs a JDK 8 or newer).
jvm = ["dep:jni"]

[dependencies]
bhmod-manifest.workspace = true
bhmod-proto.workspace = true
serde.workspace = true
toml.workspace = true
semver.workspace = true
zip.workspace = true
mlua = { version = "0.12", features = ["luau"], optional = true }
jni = { version = "0.21", features = ["invocation"], optional = true }

[dev-dependencies]
tempfile.workspace = true
jni = { version = "0.21", features = ["invocation"] }
