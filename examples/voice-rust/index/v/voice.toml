sha256 = "94e1b9ac1dcbbda8597bbb0397ee73e17dfa2c715bc1344e0416d4ac911ab11e"
size = 257818
sides = ["server", "client"]
client-required = false
api = "^0.3.4"
soft-depends = { perms = "^1" }
permissions = { voice = true, channels = true, players = ["kick"] }
published = 2026-10-28
