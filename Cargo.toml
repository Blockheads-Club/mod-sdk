[workspace]
resolver = "2"
members = [
    "crates/bhmod-manifest",
    "crates/bhmod-proto",
    "crates/bhmod-cli",
    "crates/bhmod-core",
    "crates/bhmod-index",
    "crates/bhmod-wasm",
    "crates/bhmod-client",
    "crates/bhmod-content",
    "crates/bhmod-native",
    "crates/bhmod-android",
    "crates/bhmod-voice",
    "crates/bhmod-opus-sys",
]
# Guest code builds for wasm32-wasip2 on its own (scripts/build-wasm.sh).
exclude = [
    "examples/hello-rust",
    "examples/chat-filter-rust",
    "examples/scheduler-rust",
    "examples/shop-rust",
    "examples/prices-rust",
    "sdk/rust/blockheads-mod",
    "crates/bhmod-wasm/tests/guest",
    "crates/bhmod-wasm/tests/guest01",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Blockheads-Club/mod-sdk"
authors = ["Blockheads Club contributors"]

[workspace.dependencies]
bhmod-manifest = { path = "crates/bhmod-manifest", version = "0.3.1" }
bhmod-proto = { path = "crates/bhmod-proto", version = "0.3.1" }
bhmod-client = { path = "crates/bhmod-client", version = "0.3.1" }
bhmod-content = { path = "crates/bhmod-content", version = "0.3.1" }
bhmod-index = { path = "crates/bhmod-index", version = "0.3.1" }
bhmod-native = { path = "crates/bhmod-native", version = "0.3.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"

# The WASM tests compile guest components with Cranelift; an unoptimised Cranelift makes them ~5x slower.
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
