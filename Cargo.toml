[workspace]
resolver = "2"
members = [
    "crates/bhmod-manifest",
    "crates/bhmod-proto",
    "crates/bhmod-cli",
    "crates/bhmod-core",
    "crates/bhmod-index",
]
# The Rust example builds for wasm32-wasip2 on its own.
exclude = ["examples/hello-rust", "examples/shop-rust"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Blockheads-Club/mod-sdk"
authors = ["Blockheads Club contributors"]

[workspace.dependencies]
bhmod-manifest = { path = "crates/bhmod-manifest", version = "0.1.0" }
bhmod-proto = { path = "crates/bhmod-proto", version = "0.1.0" }
bhmod-index = { path = "crates/bhmod-index", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"
