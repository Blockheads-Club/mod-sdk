name: CI

on:
  push:
    branches: [main, dev, "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  LUAU_VERSION: "0.743"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy with the JVM runtime
        run: cargo clippy --workspace --all-targets --locked --features bhmod-core/jvm,bhmod-android/jvm -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            target/wasm-guests
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the WASM guests (Rust examples and the bhmod-wasm test guest)
        run: LOCKED=--locked scripts/build-wasm.sh
      - name: Build the Java SDK and the Java example mods
        run: scripts/build-java.sh
      - name: Conformance suite (Luau and WASM twins of every example behave the same)
        run: cargo test -p bhmod-wasm --test conformance --locked
      - name: Conformance suite for the JVM runtime (Luau and Java twins)
        run: cargo test -p bhmod-core --features jvm --test jvm_conformance --locked
      - name: Schema tests (JSON Schemas vs fixtures and the Rust validator)
        run: cargo test -p bhmod-manifest --test schema --locked
      - name: Protocol vectors (byte-exact)
        run: cargo test -p bhmod-proto --test vectors --locked
      - name: Tests with 100 % line coverage gate
        # The wasmtime bindgen! output (bhmod-wasm/src/wit*.rs) is generated code and not measured.
        run: cargo llvm-cov --workspace --features bhmod-core/jvm,bhmod-android/jvm --locked --ignore-filename-regex 'bhmod-wasm/src/wit' --fail-under-lines 100 --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only

  wit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: Validate the blockheads:api WIT package
        run: wasm-tools component wit wit/blockheads-api > /dev/null
      - name: The generated Java bindings match the WIT
        run: python3 scripts/gen-java.py --check

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            target/wasm-guests
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build bhmod
        run: cargo build -p bhmod --locked
      - name: Java SDK and example mods (javac, jar)
        run: scripts/build-java.sh
      - name: Install Luau
        run: |
          curl -sSfL "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip" -o "$RUNNER_TEMP/luau.zip"
          unzip -q "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/luau"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"
      - name: Luau syntax check (examples and templates)
        run: luau-compile --null examples/*/server/*.luau examples/*/client/*.luau crates/bhmod-cli/templates/lua/main.luau
      - name: Rust SDK and WASM examples (fmt, clippy, build the components)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/wasm-guests
        run: |
          for d in sdk/rust/blockheads-mod examples/hello-rust examples/chat-filter-rust examples/scheduler-rust examples/shop-rust examples/prices-rust crates/bhmod-wasm/tests/guest crates/bhmod-wasm/tests/guest03; do
            (cd "$d" && cargo fmt --check && cargo clippy --locked --target wasm32-wasip2 -- -D warnings)
          done
          LOCKED=--locked scripts/build-wasm.sh
      - name: C bindings generate (wit-bindgen c)
        run: |
          cargo install --locked wit-bindgen-cli --version 0.63.0
          wit-bindgen c wit/blockheads-api --world server-mod --out-dir "$RUNNER_TEMP/c-bindings"
          test -s "$RUNNER_TEMP/c-bindings/server_mod.h"
      # TinyGo / Zig / C example builds are documented in docs/wasm.md but not run here yet (no toolchain in CI).
      - name: bhmod check on the examples
        run: |
          for e in hello-lua chat-filter scheduler-lua economy perms landclaim hello-rust chat-filter-rust scheduler-rust shop-rust prices-lua prices-rust hello-java chat-filter-java scheduler-java shop-java; do ./target/debug/bhmod check --index "examples/$e"; done
      - name: bhmod pack on the examples
        run: |
          for e in hello-lua chat-filter scheduler-lua economy perms landclaim hello-rust chat-filter-rust scheduler-rust shop-rust prices-lua prices-rust hello-java chat-filter-java scheduler-java shop-java; do
            ./target/debug/bhmod pack "examples/$e" -o "$RUNNER_TEMP/$e.bhmod"
            ./target/debug/bhmod check --index "$RUNNER_TEMP/$e.bhmod"
          done
      - name: Templates build and pass check
        run: |
          ./target/debug/bhmod new tpl-lua --lang lua --dir "$RUNNER_TEMP"
          ./target/debug/bhmod check "$RUNNER_TEMP/tpl-lua"
          ./target/debug/bhmod new tpl-rust --lang rust --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/tpl-rust" && ./build.sh)
          ./target/debug/bhmod check "$RUNNER_TEMP/tpl-rust"
          ./target/debug/bhmod new tpl-java --lang java --dir "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/tpl-java/libs" && cp target/java-sdk/blockheads-mod-sdk.jar "$RUNNER_TEMP/tpl-java/libs/"
          (cd "$RUNNER_TEMP/tpl-java" && ./build.sh)
          ./target/debug/bhmod check "$RUNNER_TEMP/tpl-java"
          rm "$RUNNER_TEMP/tpl-java/server/mod.jar"
          (cd "$RUNNER_TEMP/tpl-java" && gradle --no-daemon -q jar)
          ./target/debug/bhmod check "$RUNNER_TEMP/tpl-java"

  # The WASM runtime on a 32-bit host: Pulley on armv7 under qemu (cross). Experimental until the first green run.
  wasm-armv7:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2,armv7-unknown-linux-gnueabihf
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build the WASM guests
        run: LOCKED=--locked scripts/build-wasm.sh
      - name: bhmod-wasm tests on armv7 (Pulley, tail-call dispatch)
        env:
          RUSTFLAGS: --cfg pulley_assume_llvm_makes_tail_calls
          # The default cross image's g++ 5 cannot build Luau (C++17); the main image can.
          CROSS_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_IMAGE: ghcr.io/cross-rs/armv7-unknown-linux-gnueabihf:main
        run: cross test -p bhmod-wasm --locked --target armv7-unknown-linux-gnueabihf
